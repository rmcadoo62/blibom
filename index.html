<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ballantine BOM</title>
<style>
  :root{
    --bg:#f5f1e8;
    --panel:#ffffff;
    --panel-2:#faf7ef;
    --border:#e2dac4;
    --border-soft:#ece5d2;
    --text:#241f18;
    --text-dim:#736b57;
    --text-faint:#a89c81;
    --accent:#a02328;
    --accent-soft:#f1d9d5;
    --accent-dim:#d8bdb8;
    --topbar-bg:#1c1712;
    --topbar-text:#f5efe2;
    --amber:#a9721e;
    --red:#a02328;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: "Helvetica Neue", Arial, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);height:100%;}
  #root{min-height:100vh;display:flex;flex-direction:column;}

  /* ---- top bar ---- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 24px;border-bottom:1px solid #000;
    background:var(--topbar-bg);color:var(--topbar-text);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:30px;height:30px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
  }
  .brand-mark img{width:100%;height:100%;object-fit:contain;display:block;}
  .brand-name{font-weight:700;letter-spacing:0.01em;font-size:15px;color:var(--topbar-text);}
  .brand-sub{font-size:10.5px;color:#b8ac95;letter-spacing:0.08em;text-transform:uppercase;margin-left:4px;}
  .tabs{display:flex;gap:2px;}
  .tab{
    padding:7px 14px;font-size:13px;color:#b8ac95;cursor:pointer;
    border-bottom:2px solid transparent;font-weight:600;letter-spacing:0.01em;
  }
  .tab.active{color:#fff;border-bottom-color:var(--accent);}
  .tab:hover{color:#fff;}
  .user-chip{display:flex;align-items:center;gap:10px;font-size:12.5px;color:#c9bfa8;}
  .btn-ghost{
    background:transparent;border:1px solid #4a4033;color:#d8cdb6;
    padding:5px 10px;border-radius:5px;font-size:12px;cursor:pointer;font-family:var(--sans);
  }
  .btn-ghost:hover{border-color:#8a7c5f;color:#fff;}
  .btn-outline{
    background:transparent;border:1px solid var(--border);color:var(--text-dim);
    padding:8px 14px;border-radius:5px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--sans);
  }
  .btn-outline:hover{border-color:var(--text-faint);color:var(--text);}

  main{flex:1;padding:26px 30px;max-width:1180px;width:100%;margin:0 auto;}

  /* ---- auth screen ---- */
  .auth-wrap{
    height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:22px;
    background:var(--bg);
  }
  .auth-card{
    width:340px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:26px 26px 22px;
    box-shadow:0 1px 3px rgba(36,31,24,0.06);
  }
  .auth-title{font-size:16px;font-weight:700;margin-bottom:2px;}
  .auth-sub{font-size:12.5px;color:var(--text-faint);margin-bottom:20px;}
  label{display:block;font-size:10.5px;color:var(--text-dim);margin-bottom:5px;margin-top:14px;letter-spacing:0.06em;text-transform:uppercase;font-weight:600;}
  input[type=text],input[type=email],input[type=password],input[type=number],textarea,select{
    width:100%;background:#fff;border:1px solid var(--border);color:var(--text);
    padding:8px 10px;border-radius:5px;font-size:13.5px;font-family:var(--sans);outline:none;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--accent);}
  .btn-primary{
    width:100%;margin-top:20px;background:var(--accent);color:#fff;border:none;
    padding:9px 12px;border-radius:5px;font-weight:700;font-size:13.5px;cursor:pointer;letter-spacing:0.01em;
  }
  .btn-primary:hover{opacity:0.9;}
  .btn-primary:disabled{opacity:0.5;cursor:default;}
  .auth-toggle{text-align:center;font-size:12.5px;color:var(--text-faint);margin-top:16px;cursor:pointer;}
  .auth-toggle span{color:var(--accent);font-weight:600;}
  .auth-error{background:#fbeceb;border:1px solid #eecac8;color:var(--red);
    font-size:12px;padding:8px 10px;border-radius:5px;margin-top:14px;}
  .auth-note{background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);
    font-size:11.5px;padding:8px 10px;border-radius:5px;margin-top:14px;line-height:1.5;}

  /* ---- generic ---- */
  .section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .section-title{font-size:20px;font-weight:700;letter-spacing:-0.01em;}
  .section-count{font-size:12px;color:var(--text-faint);margin-left:8px;font-weight:500;}
  .btn-add{
    background:var(--accent);border:1px solid var(--accent);color:#fff;
    padding:8px 14px;border-radius:5px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:var(--sans);
  }
  .btn-add:hover{opacity:0.9;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  thead th{
    text-align:left;font-size:10.5px;color:var(--text-faint);
    text-transform:uppercase;letter-spacing:0.07em;padding:8px 10px;border-bottom:1.5px solid var(--text);
    font-weight:700;
  }
  tbody td{padding:10px 10px;border-bottom:1px solid var(--border-soft);color:var(--text);}
  tbody tr:hover{background:var(--panel-2);}
  .mono{font-family:var(--mono);}
  .dim{color:var(--text-dim);}
  .faint{color:var(--text-faint);}
  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .row-actions{display:flex;gap:6px;opacity:0;transition:opacity 0.1s;}
  tr:hover .row-actions{opacity:1;}
  .icon-btn{
    background:transparent;border:none;color:var(--text-faint);cursor:pointer;font-size:12px;padding:2px 5px;font-weight:600;
  }
  .icon-btn:hover{color:var(--accent);}
  .icon-btn.danger:hover{color:var(--red);}

  .empty{
    padding:50px 20px;text-align:center;color:var(--text-faint);font-size:13px;
    border:1px dashed var(--border);border-radius:6px;background:var(--panel);
  }
  .empty b{color:var(--text-dim);display:block;margin-bottom:4px;font-weight:700;}

  /* ---- modal ---- */
  .overlay{
    position:fixed;inset:0;background:rgba(28,23,18,0.45);display:flex;align-items:center;justify-content:center;z-index:50;
  }
  .modal{
    width:400px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:22px;
    max-height:85vh;overflow:auto;box-shadow:0 8px 24px rgba(28,23,18,0.18);
  }
  .modal-title{font-size:15px;font-weight:700;margin-bottom:4px;}
  .modal-actions{display:flex;gap:8px;margin-top:20px;}
  .btn-secondary{
    flex:1;background:transparent;border:1px solid var(--border);color:var(--text-dim);
    padding:8px 12px;border-radius:5px;font-size:13px;cursor:pointer;font-family:var(--sans);font-weight:600;
  }
  .btn-secondary:hover{color:var(--text);border-color:var(--text-faint);}
  .modal .btn-primary{margin-top:0;flex:1.4;}
  .field-row{display:flex;gap:10px;}
  .field-row > div{flex:1;}

  /* ---- BOM list ---- */
  .bom-card{
    background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:14px 16px;
    display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;cursor:pointer;
  }
  .bom-card:hover{border-color:var(--accent);}
  .bom-name{font-weight:700;font-size:13.5px;}
  .bom-meta{font-size:11px;color:var(--text-faint);margin-top:3px;font-weight:500;letter-spacing:0.02em;}
  .status-pill{
    font-size:10px;text-transform:uppercase;letter-spacing:0.06em;font-weight:700;
    padding:3px 9px;border-radius:20px;border:1px solid var(--border);
  }
  .status-draft{color:var(--text-dim);}
  .status-released{color:var(--accent);border-color:var(--accent-dim);background:var(--accent-soft);}
  .status-obsolete{color:var(--text-faint);}

  /* ---- BOM detail / tree ---- */
  .back-link{
    color:var(--text-faint);font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;margin-bottom:14px;font-weight:600;
  }
  .back-link:hover{color:var(--accent);}
  .bom-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .bom-title{font-size:20px;font-weight:700;letter-spacing:-0.01em;}
  .bom-sub{font-size:11.5px;color:var(--text-faint);margin-top:4px;font-weight:500;}
  .totals{
    display:flex;gap:22px;background:var(--panel);border:1px solid var(--border);border-radius:6px;
    padding:12px 18px;margin-bottom:18px;
  }
  .total-item .t-label{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.06em;font-weight:700;}
  .total-item .t-value{font-size:17px;color:var(--accent);margin-top:2px;font-weight:700;}

  .tree-wrap{background:var(--panel);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
  .tree-header{
    display:flex;align-items:center;padding:8px 12px 8px 42px;gap:8px;
    border-bottom:1.5px solid var(--text);background:var(--panel-2);
  }
  .tree-header span{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.06em;font-weight:700;}
  .th-pn{min-width:90px;flex-shrink:0;}
  .th-desc{flex:1;}
  .th-ref{width:56px;flex-shrink:0;}
  .th-vendor{width:78px;flex-shrink:0;}
  .th-qty{width:70px;flex-shrink:0;text-align:right;}
  .th-cost{width:80px;flex-shrink:0;text-align:right;}
  .th-actions{width:96px;flex-shrink:0;}

  .vendor-toggle{
    width:78px;flex-shrink:0;background:transparent;border:none;color:var(--accent);
    font-size:11px;font-weight:600;cursor:pointer;text-align:left;padding:0;
  }
  .vendor-toggle:hover{text-decoration:underline;}
  .vendor-toggle-spacer{width:78px;flex-shrink:0;}
  .notes-row{
    padding:7px 12px 7px;font-size:11.5px;color:var(--text-dim);background:var(--panel-2);
    border-bottom:1px solid var(--border-soft);line-height:1.5;
  }

  .tree-row{
    display:flex;align-items:center;padding:9px 12px;border-bottom:1px solid var(--border-soft);gap:8px;font-size:13px;
  }
  .tree-row:last-child{border-bottom:none;}
  .tree-row:hover{background:var(--panel-2);}
  .tree-toggle{
    width:16px;height:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    color:var(--text-faint);font-size:10px;flex-shrink:0;
  }
  .tree-toggle.leaf{visibility:hidden;}
  .tree-pn{font-weight:700;color:var(--accent);font-size:12.5px;flex-shrink:0;min-width:90px;}
  .tree-desc{flex:1;color:var(--text);}
  .tree-ref{font-size:11px;color:var(--text-faint);font-weight:600;width:56px;flex-shrink:0;}
  .tree-qty{font-size:12.5px;color:var(--text-dim);width:70px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums;}
  .tree-cost{font-size:12.5px;color:var(--text);width:80px;text-align:right;flex-shrink:0;font-weight:600;font-variant-numeric:tabular-nums;}
  .tree-actions{display:flex;gap:4px;opacity:0;flex-shrink:0;}
  .tree-row:hover .tree-actions{opacity:1;}

  .add-line-btn{
    padding:9px 12px;font-size:12px;color:var(--text-faint);cursor:pointer;font-weight:600;
    border-top:1px dashed var(--border-soft);
  }
  .add-line-btn:hover{color:var(--accent);background:var(--panel-2);}

  ::placeholder{color:var(--text-faint);}
  .loading{padding:60px;text-align:center;color:var(--text-faint);font-size:12px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;}
</style>
</head>

<div id="root"></div>

let currentSession = null; // {access_token, refresh_token, user}

function authHeaders(extra){
  return {
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + (currentSession?.access_token || SUPABASE_ANON_KEY),
    'Content-Type': 'application/json',
    ...(extra||{}),
  };
}

async function restRequest(path, opts={}){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: { ...authHeaders(opts.prefer ? {Prefer: opts.prefer} : {}), ...(opts.headers||{}) },
  });
  if(!res.ok){
    let msg = res.statusText;
    try{ const j = await res.json(); msg = j.message || j.msg || msg; }catch(e){}
    throw new Error(msg);
  }
  if(res.status === 204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function authRequest(path, body){
  const res = await fetch(`${SUPABASE_URL}/auth/v1/${path}`, {
    method: 'POST',
    headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const json = await res.json().catch(()=>({}));
  if(!res.ok){
    throw new Error(json.error_description || json.msg || json.error || 'Authentication failed');
  }
  return json;
}

const supabase = {
  auth: {
    async signUp({email, password}){
      try{
        const data = await authRequest('signup', {email, password});
        if(data.access_token){ currentSession = {access_token:data.access_token, refresh_token:data.refresh_token, user:data.user}; }
        return {data: {session: currentSession, user: data.user}, error:null};
      }catch(e){ return {data:null, error:{message:e.message}}; }
    },
    async signInWithPassword({email, password}){
      try{
        const data = await authRequest('token?grant_type=password', {email, password});
        currentSession = {access_token:data.access_token, refresh_token:data.refresh_token, user:data.user};
        return {data: {session: currentSession, user: data.user}, error:null};
      }catch(e){ return {data:null, error:{message:e.message}}; }
    },
    async signOut(){
      currentSession = null;
      return {error:null};
    },
    async getSession(){
      return {data:{session: currentSession}};
    },
    onAuthStateChange(){
      // no-op: this minimal client doesn't persist sessions across reload
      // (artifacts can't use localStorage), so there's nothing to listen for.
      return {data:{subscription:{unsubscribe(){}}}};
    },
  },
  from(table){
    return {
      select(cols='*'){
        const params = new URLSearchParams({select: cols});
        const builder = {
          _filters: [],
          _order: null,
          eq(col, val){ builder._filters.push(`${col}=eq.${encodeURIComponent(val)}`); return builder; },
          order(col, {ascending=true}={}){ builder._order = `${col}.${ascending?'asc':'desc'}`; return builder; },
          async then(resolve, reject){
            try{
              let qs = params.toString();
              if(builder._filters.length) qs += '&' + builder._filters.join('&');
              if(builder._order) qs += `&order=${builder._order}`;
              const data = await restRequest(`${table}?${qs}`, {method:'GET'});
              resolve({data, error:null});
            }catch(e){ resolve({data:null, error:{message:e.message}}); }
          },
          single(){
            const p = builder.then.bind(builder);
            return { then(resolve,reject){ p((r)=>resolve({data:r.data?.[0]||null, error:r.error}), reject); } };
          },
        };
        return builder;
      },
      insert(payload){
        const exec = async () => {
          try{
            const data = await restRequest(table, {method:'POST', body:JSON.stringify(payload), prefer:'return=representation'});
            return {data, error:null};
          }catch(e){ return {data:null, error:{message:e.message}}; }
        };
        return {
          then(resolve){ exec().then(resolve); },
          select(){
            return {
              single: async () => {
                const r = await exec();
                return {data: r.data?.[0]||null, error:r.error};
              },
            };
          },
        };
      },
      update(payload){
        return {
          eq: async (col, val) => {
            try{
              const data = await restRequest(`${table}?${col}=eq.${encodeURIComponent(val)}`, {method:'PATCH', body:JSON.stringify(payload), prefer:'return=representation'});
              return {data, error:null};
            }catch(e){ return {data:null, error:{message:e.message}}; }
          },
        };
      },
      delete(){
        return {
          eq: async (col, val) => {
            try{
              await restRequest(`${table}?${col}=eq.${encodeURIComponent(val)}`, {method:'DELETE'});
              return {error:null};
            }catch(e){ return {error:{message:e.message}}; }
          },
        };
      },
    };
  },
};

const root = document.getElementById('root');
let state = {
  session: null,
  authMode: 'login', // 'login' | 'signup'
  authError: '',
  authLoading: false,
  view: 'boms', // 'parts' | 'vendors' | 'boms' | 'bomDetail'
  parts: [],
  boms: [],
  vendors: [],
  manufacturers: [],
  partVendorLinks: [], // for the active BOM's parts, loaded on demand per line
  activeBomId: null,
  bomItems: [], // flat list for active bom
  expanded: {}, // item id -> bool
  notesOpen: {}, // item id -> bool (vendor/mfgr info visibility)
  lineVendorInfo: {}, // item id -> {vendors:[], manufacturers:[], substitutes:[]}
  modal: null, // {type: 'part'|'bom'|'line'|'vendor', data:{}, editingId}
  loading: true,
};

function setState(patch){ state = {...state, ...patch}; render(); }

// ---------- data loading ----------
async function loadAll(){
  setState({loading:true});
  const [{data:parts}, {data:boms}, {data:vendors}, {data:manufacturers}] = await Promise.all([
    supabase.from('parts').select('*').order('part_number'),
    supabase.from('boms').select('*').order('created_at', {ascending:false}),
    supabase.from('vendors').select('*').order('name'),
    supabase.from('manufacturers').select('*').order('name'),
  ]);
  setState({parts: parts||[], boms: boms||[], vendors: vendors||[], manufacturers: manufacturers||[], loading:false});
}

async function loadBomItems(bomId){
  const {data} = await supabase.from('bom_items').select('*, parts(*)').eq('bom_id', bomId).order('sort_order');
  setState({bomItems: data||[]});
}

async function loadPartVendorInfo(itemId, partId){
  const [{data:pv}, {data:pm}, {data:ps}] = await Promise.all([
    supabase.from('part_vendors').select('*, vendors(*)').eq('part_id', partId),
    supabase.from('part_manufacturers').select('*, manufacturers(*)').eq('part_id', partId),
    supabase.from('part_substitutes').select('*').eq('part_id', partId),
  ]);
  setState({lineVendorInfo: {...state.lineVendorInfo, [itemId]: {
    vendors: pv||[], manufacturers: pm||[], substitutes: ps||[]
  }}});
}

// ---------- auth ----------
supabase.auth.getSession().then(({data})=>{
  setState({session: data.session});
  if(data.session) loadAll();
});
supabase.auth.onAuthStateChange((_event, session)=>{
  setState({session});
  if(session) loadAll();
});

async function handleAuthSubmit(email, password){
  setState({authLoading:true, authError:''});
  if(state.authMode === 'login'){
    const {data, error} = await supabase.auth.signInWithPassword({email, password});
    if(error) setState({authError: error.message, authLoading:false});
    else {
      setState({authLoading:false, session: data.session});
      loadAll();
    }
  } else {
    const {data, error} = await supabase.auth.signUp({email, password});
    if(error) setState({authError: error.message, authLoading:false});
    else if(data.session){
      // Email confirmation is off — session is active immediately.
      setState({authLoading:false, session: data.session});
      loadAll();
    } else {
      // Email confirmation required — no session yet.
      setState({authLoading:false, authError:'__signup_ok__'});
    }
  }
}

async function handleLogout(){
  await supabase.auth.signOut();
  setState({view:'boms', activeBomId:null, parts:[], boms:[]});
}

// ---------- parts CRUD ----------
async function savePart(data, editingId){
  const payload = {
    part_number: data.part_number.trim(),
    description: data.description.trim(),
    unit_cost: parseFloat(data.unit_cost) || 0,
    unit_of_measure: data.unit_of_measure.trim() || 'EA',
    supplier: data.supplier.trim(),
    notes: data.notes.trim(),
  };
  if(editingId){
    await supabase.from('parts').update(payload).eq('id', editingId);
  } else {
    await supabase.from('parts').insert(payload);
  }
  setState({modal:null});
  loadAll();
}

async function deletePart(id){
  if(!confirm('Delete this part? This cannot be undone.')) return;
  await supabase.from('parts').delete().eq('id', id);
  loadAll();
}

    name: data.name.trim(),
    contact_info: data.contact_info.trim(),
    notes: data.notes.trim(),
  };
  if(editingId){
    await supabase.from('vendors').update(payload).eq('id', editingId);
  } else {
    await supabase.from('vendors').insert(payload);
  }
  setState({modal:null});
  loadAll();
}

async function deleteVendor(id){
  if(!confirm('Delete this vendor? Any parts linked to it will lose that link.')) return;
  await supabase.from('vendors').delete().eq('id', id);
  loadAll();
}

// ---------- BOM CRUD ----------
async function saveBom(data, editingId){
  const payload = {
    name: data.name.trim(),
    product_number: data.product_number.trim(),
    revision: data.revision.trim() || 'A',
    status: data.status || 'draft',
    notes: data.notes.trim(),
  };
  if(editingId){
    await supabase.from('boms').update(payload).eq('id', editingId);
  } else {
    const {data:inserted} = await supabase.from('boms').insert(payload).select().single();
    setState({modal:null});
    await loadAll();
    if(inserted) openBom(inserted.id);
    return;
  }
  setState({modal:null});
  loadAll();
}

async function deleteBom(id, e){
  e && e.stopPropagation();
  if(!confirm('Delete this BOM and all its line items? This cannot be undone.')) return;
  await supabase.from('boms').delete().eq('id', id);
  loadAll();
}

function openBom(id){
  setState({view:'bomDetail', activeBomId:id, expanded:{}});
  loadBomItems(id);
}

// ---------- line items CRUD ----------
async function saveLine(data, editingId){
  const parsedQty = parseFloat(data.quantity);
  const payload = {
    bom_id: state.activeBomId,
    parent_item_id: data.parent_item_id || null,
    part_id: data.part_id,
    quantity: Number.isFinite(parsedQty) ? parsedQty : 1,
    reference_designator: data.reference_designator.trim(),
    notes: (data.notes||'').trim(),
  };
  if(editingId){
    delete payload.bom_id; delete payload.parent_item_id;
    await supabase.from('bom_items').update(payload).eq('id', editingId);
  } else {
    await supabase.from('bom_items').insert(payload);
  }
  setState({modal:null});
  loadBomItems(state.activeBomId);
}

async function deleteLine(id){
  if(!confirm('Delete this line item and any nested sub-items?')) return;
  await supabase.from('bom_items').delete().eq('id', id);
  loadBomItems(state.activeBomId);
}

// ---------- helpers ----------
function fmtMoney(n){ return '$' + (Number(n)||0).toFixed(2); }

function buildTree(items){
  const byParent = {};
  items.forEach(it=>{
    const key = it.parent_item_id || 'root';
    (byParent[key] = byParent[key] || []).push(it);
  });
  return byParent;
}

function lineExtended(item, byParent){
  // extended cost = own part cost*qty + sum of children's extended (children qty already relative to parent's 1 unit)
  const own = (item.parts?.unit_cost || 0) * item.quantity;
  const kids = byParent[item.id] || [];
  const kidsCost = kids.reduce((sum,k)=> sum + lineExtended(k, byParent) * item.quantity, 0);
  return own + kidsCost;
}

// ---------- render ----------
function render(){
  // Overlays are appended to <body>, outside #root, so they must be
  // cleaned up explicitly on every render or a closed modal leaves a
  // stuck, invisible-click-blocking layer behind.
  document.querySelectorAll('.overlay').forEach(el => el.remove());

  if(!state.session){
    renderAuth();
    return;
  }
  renderApp();
}

  const isSignup = state.authMode === 'signup';
  root.innerHTML = `
    <div class="auth-wrap">
      <div style="display:flex;align-items:center;">
        <img src="${LOGO_FULL}" alt="Ballantine Laboratories, Inc." style="height:38px;" />
      </div>
      <div class="auth-card">
        <div class="auth-title">${isSignup ? 'Create an account' : 'Sign in'}</div>
        <div class="auth-sub">/// internal access only</div>
        <form id="auth-form">
          <label>Email</label>
          <input type="email" id="auth-email" required autocomplete="email" />
          <label>Password</label>
          <input type="password" id="auth-password" required autocomplete="${isSignup?'new-password':'current-password'}" minlength="6" />
          <button class="btn-primary" type="submit" ${state.authLoading?'disabled':''}>${state.authLoading ? 'Working…' : (isSignup ? 'Create account' : 'Sign in')}</button>
        </form>
        ${state.authError === '__signup_ok__' ? `<div class="auth-note">Account created. If email confirmation is required, check your inbox before signing in.</div>` : ''}
        ${state.authError && state.authError !== '__signup_ok__' ? `<div class="auth-error">${escapeHtml(state.authError)}</div>` : ''}
        <div class="auth-toggle" id="auth-toggle">
          ${isSignup ? 'Already have an account? <span>Sign in</span>' : "Need an account? <span>Create one</span>"}
        </div>
      </div>
    </div>
  `;
  document.getElementById('auth-form').addEventListener('submit', (e)=>{
    e.preventDefault();
    const email = document.getElementById('auth-email').value;
    const password = document.getElementById('auth-password').value;
    handleAuthSubmit(email, password);
  });
  document.getElementById('auth-toggle').addEventListener('click', ()=>{
    setState({authMode: isSignup ? 'login' : 'signup', authError:''});
  });
}

function renderApp(){
  root.innerHTML = `
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark"><img src="${LOGO_MARK}" alt="Ballantine" /></div>
        <div class="brand-name">Ballantine BOM</div>
        <div class="tabs" style="margin-left:22px;">
          <div class="tab ${state.view==='boms'||state.view==='bomDetail' ? 'active':''}" data-tab="boms">BOMs</div>
          <div class="tab ${state.view==='parts' ? 'active':''}" data-tab="parts">Parts Library</div>
          <div class="tab ${state.view==='vendors' ? 'active':''}" data-tab="vendors">Vendors</div>
        </div>
      </div>
      <div class="user-chip">
        <span class="mono">${escapeHtml(state.session.user.email)}</span>
        <button class="btn-ghost" id="logout-btn">Sign out</button>
      </div>
    </div>
    <main id="main"></main>
  `;
  document.querySelectorAll('.tab').forEach(el=>{
    el.addEventListener('click', ()=> setState({view: el.dataset.tab}));
  });
  document.getElementById('logout-btn').addEventListener('click', handleLogout);

  const main = document.getElementById('main');
  if(state.loading){
    main.innerHTML = `<div class="loading">LOADING…</div>`;
  } else if(state.view === 'parts'){
    renderParts(main);
  } else if(state.view === 'vendors'){
    renderVendors(main);
  } else if(state.view === 'bomDetail'){
    renderBomDetail(main);
  } else {
    renderBomsList(main);
  }
  if(state.modal) renderModal();
}

        <div class="row-actions">

          <button class="icon-btn danger" data-del-part="${p.id}">Delete</button>

function renderBomsList(main){
  const cards = state.boms.map(b=>`
    <div class="bom-card" data-open-bom="${b.id}">
      <div>
        <div class="bom-name">${escapeHtml(b.name)}</div>
        <div class="bom-meta">${escapeHtml(b.product_number||'—')} &middot; REV ${escapeHtml(b.revision)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">

function renderBomDetail(main){
  const bom = state.boms.find(b=>b.id === state.activeBomId);
  if(!bom){ setState({view:'boms'}); return; }
  const byParent = buildTree(state.bomItems);
  const roots = byParent['root'] || [];
  const grandTotal = roots.reduce((s,r)=> s + lineExtended(r, byParent), 0);

  function renderRows(items, depth){
    return items.map(item=>{
      const kids = byParent[item.id] || [];
      const hasKids = kids.length > 0;
      const isOpen = !!state.expanded[item.id];
      const ext = lineExtended(item, byParent);
      const freeNotes = (item.parts?.notes || '').trim();
      const infoShown = !!state.notesOpen[item.id];
      const info = state.lineVendorInfo[item.id];
      let infoPanel = '';
      if(infoShown){
        if(!info){
          infoPanel = `<div class="notes-row" style="padding-left:${12 + depth*22 + 24}px;">Loading…</div>`;
        } else {
          const vLines = info.vendors.map(v=>`${escapeHtml(v.vendors?.name||'?')}${v.vendors?.vendor_code ? ' (#'+escapeHtml(v.vendors.vendor_code)+')' : ''}${v.vendor_part_number ? ' — pn: '+escapeHtml(v.vendor_part_number) : ''}`);
          const mLines = info.manufacturers.map(m=>`${escapeHtml(m.manufacturers?.name||'?')}${m.mfg_part_number ? ' — pn: '+escapeHtml(m.mfg_part_number) : ''}`);
          const sLines = info.substitutes.map(s=>`${escapeHtml(s.substitute_part_number)}${s.description ? ' — '+escapeHtml(s.description) : ''}`);
          const hasAny = vLines.length || mLines.length || sLines.length || freeNotes;
          infoPanel = `<div class="notes-row" style="padding-left:${12 + depth*22 + 24}px;">
            ${vLines.length ? `<div><b>Vendors:</b> ${vLines.join('; ')}</div>` : ''}
            ${mLines.length ? `<div><b>Manufacturers:</b> ${mLines.join('; ')}</div>` : ''}
            ${sLines.length ? `<div><b>Substitutes:</b> ${sLines.join('; ')}</div>` : ''}
            ${freeNotes ? `<div><b>Notes:</b> ${escapeHtml(freeNotes)}</div>` : ''}
            ${!hasAny ? `<div class="faint">No vendor, manufacturer, or note info on file for this part.</div>` : ''}
          </div>`;
        }
      }
      let html = `
        <div class="tree-row" style="padding-left:${12 + depth*22}px;">
          <div class="tree-toggle ${hasKids ? '' : 'leaf'}" data-toggle="${item.id}">${isOpen ? '▾' : '▸'}</div>
          <div class="tree-pn">${escapeHtml(item.parts?.part_number||'?')}</div>
          <div class="tree-desc">${escapeHtml(item.parts?.description||'')}</div>
          <div class="tree-ref">${escapeHtml(item.reference_designator||'')}</div>
          <button class="vendor-toggle" data-vendor-toggle="${item.id}" data-part-id="${item.part_id}" title="Vendor / manufacturer info">${infoShown ? 'Hide info' : 'Vendor info'}</button>
          <div class="tree-qty">Qty <b>${item.quantity}</b></div>
          <div class="tree-cost">${fmtMoney(ext)}</div>
          <div class="tree-actions">
            <button class="icon-btn" data-add-child="${item.id}" title="Add sub-item">+ Sub</button>
            <button class="icon-btn" data-edit-line="${item.id}">Edit</button>
            <button class="icon-btn danger" data-del-line="${item.id}">Del</button>
          </div>
        </div>
        ${infoPanel}
      `;
      if(hasKids && isOpen){
        html += renderRows(kids, depth+1);
      }
      return html;
    }).join('');
  }

  main.innerHTML = `
    <div class="back-link" id="back-to-boms">← All BOMs</div>
    <div class="bom-header">
      <div>
        <div class="bom-title">${escapeHtml(bom.name)}</div>
        <div class="bom-sub">${escapeHtml(bom.product_number||'—')} &middot; REV ${escapeHtml(bom.revision)} &middot; <span class="status-pill status-${bom.status}" style="margin-left:4px;">${bom.status}</span></div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn-outline" id="edit-bom-btn">Edit BOM Info</button>
        <button class="btn-add" id="add-root-line-btn">+ Add Part</button>
      </div>
    </div>
    <div class="totals">
      <div class="total-item"><div class="t-label">Line items</div><div class="t-value">${state.bomItems.length}</div></div>
      <div class="total-item"><div class="t-label">Extended cost</div><div class="t-value">${fmtMoney(grandTotal)}</div></div>
    </div>
    <div class="tree-wrap">
      <div class="tree-header">
        <span class="th-pn">Part #</span>
        <span class="th-desc">Description</span>
        <span class="th-ref">Ref</span>
        <span class="th-vendor">Vendor</span>
        <span class="th-qty">Qty</span>
        <span class="th-cost">Ext. Cost</span>
        <span class="th-actions"></span>
      </div>
      ${roots.length === 0 ? `<div class="empty" style="border:none;">Add the first part to this BOM.</div>` : renderRows(roots, 0)}
      <div class="add-line-btn" id="add-root-line-btn-2">+ add top-level part…</div>
    </div>
  `;

  document.getElementById('back-to-boms').addEventListener('click', ()=> setState({view:'boms', activeBomId:null}));
  document.getElementById('edit-bom-btn').addEventListener('click', ()=> setState({modal:{type:'bom', editingId:bom.id, data:bom}}));
  const openLineModal = (parentId)=> setState({modal:{type:'line', editingId:null, data:{parent_item_id: parentId}}});
  document.getElementById('add-root-line-btn').addEventListener('click', ()=> openLineModal(null));
  document.getElementById('add-root-line-btn-2').addEventListener('click', ()=> openLineModal(null));

  main.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.toggle;
      setState({expanded: {...state.expanded, [id]: !state.expanded[id]}});
    });
  });
  main.querySelectorAll('[data-vendor-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.vendorToggle;
      const partId = el.dataset.partId;
      const opening = !state.notesOpen[id];
      setState({notesOpen: {...state.notesOpen, [id]: opening}});
      if(opening && !state.lineVendorInfo[id]){
        loadPartVendorInfo(id, partId);
      }
    });
  });
  main.querySelectorAll('[data-add-child]').forEach(el=>{
    el.addEventListener('click', ()=> openLineModal(el.dataset.addChild));
  });
  main.querySelectorAll('[data-edit-line]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const item = state.bomItems.find(x=>x.id===el.dataset.editLine);
      setState({modal:{type:'line', editingId:item.id, data:item}});
    });
  });
  main.querySelectorAll('[data-del-line]').forEach(el=>{
    el.addEventListener('click', ()=> deleteLine(el.dataset.delLine));
  });
}

function renderModal(){
  const m = state.modal;
  let inner = '';

  if(m.type === 'part'){
    const d = m.data || {};
    inner = `
      <div class="modal-title">${m.editingId ? 'Edit Part' : 'New Part'}</div>
      <form id="modal-form">
        <label>Part Number</label>
        <input type="text" name="part_number" value="${escapeAttr(d.part_number)}" required />
        <label>Description</label>
        <input type="text" name="description" value="${escapeAttr(d.description)}" />
        <div class="field-row">
          <div><label>Unit Cost</label><input type="number" step="0.0001" name="unit_cost" value="${escapeAttr(d.unit_cost ?? '0')}" /></div>
          <div><label>Unit of Measure</label><input type="text" name="unit_of_measure" value="${escapeAttr(d.unit_of_measure || 'EA')}" /></div>
        </div>
        <label>Supplier</label>
        <input type="text" name="supplier" value="${escapeAttr(d.supplier)}" />
        <label>Notes</label>
        <textarea name="notes" rows="2">${escapeHtml(d.notes||'')}</textarea>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="modal-cancel">Cancel</button>
          <button type="submit" class="btn-primary">Save Part</button>
        </div>
      </form>
    `;
  } else if(m.type === 'bom'){
    const d = m.data || {};
    inner = `
      <div class="modal-title">${m.editingId ? 'Edit BOM' : 'New BOM'}</div>
      <form id="modal-form">
        <label>BOM Name</label>
        <input type="text" name="name" value="${escapeAttr(d.name)}" required placeholder="e.g. Widget X Assembly" />
        <div class="field-row">
          <div><label>Product Number</label><input type="text" name="product_number" value="${escapeAttr(d.product_number)}" /></div>
          <div><label>Revision</label><input type="text" name="revision" value="${escapeAttr(d.revision || 'A')}" /></div>
        </div>
        <label>Status</label>
        <select name="status">
          <option value="draft" ${d.status==='draft'?'selected':''}>Draft</option>
          <option value="released" ${d.status==='released'?'selected':''}>Released</option>
          <option value="obsolete" ${d.status==='obsolete'?'selected':''}>Obsolete</option>
        </select>
        <label>Notes</label>
        <textarea name="notes" rows="2">${escapeHtml(d.notes||'')}</textarea>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="modal-cancel">Cancel</button>
          <button type="submit" class="btn-primary">Save BOM</button>
        </div>
      </form>
    `;
  } else if(m.type === 'line'){
    const d = m.data || {};
    const partOptions = state.parts.map(p=>`<option value="${p.id}" ${d.part_id===p.id?'selected':''}>${escapeHtml(p.part_number)} — ${escapeHtml(p.description||'')}</option>`).join('');
    inner = `
      <div class="modal-title">${m.editingId ? 'Edit Line Item' : (d.parent_item_id ? 'Add Sub-Item' : 'Add Part to BOM')}</div>
      <form id="modal-form">
        <label>Part</label>
        <select name="part_id" required>
          <option value="">Select a part…</option>
          ${partOptions}
        </select>
        ${state.parts.length===0 ? `<div class="auth-note" style="margin-top:8px;">No parts in your library yet — add one in the Parts Library tab first.</div>` : ''}
        <div class="field-row">
          <div><label>Quantity</label><input type="number" step="0.0001" name="quantity" value="${escapeAttr(d.quantity ?? '1')}" required /></div>
          <div><label>Ref Designator</label><input type="text" name="reference_designator" value="${escapeAttr(d.reference_designator)}" placeholder="optional" /></div>
        </div>
        <label>Notes</label>
        <textarea name="notes" rows="2">${escapeHtml(d.notes||'')}</textarea>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="modal-cancel">Cancel</button>
          <button type="submit" class="btn-primary">Save Line</button>
        </div>
      </form>
    `;
  } else if(m.type === 'vendor'){
    const d = m.data || {};
    inner = `
      <div class="modal-title">${m.editingId ? 'Edit Vendor' : 'New Vendor'}</div>
      <form id="modal-form">
        <label>Vendor Code</label>
        <input type="text" name="vendor_code" value="${escapeAttr(d.vendor_code)}" placeholder="e.g. 5122" />
        <label>Vendor Name</label>
        <input type="text" name="name" value="${escapeAttr(d.name)}" required />
        <label>Contact Info</label>
        <input type="text" name="contact_info" value="${escapeAttr(d.contact_info)}" placeholder="phone, email, address…" />
        <label>Notes</label>
        <textarea name="notes" rows="2">${escapeHtml(d.notes||'')}</textarea>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="modal-cancel">Cancel</button>
          <button type="submit" class="btn-primary">Save Vendor</button>
        </div>
      </form>
    `;
  }

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `<div class="modal">${inner}</div>`;
  document.body.appendChild(overlay);

  overlay.addEventListener('mousedown', (e)=>{ if(e.target === overlay) setState({modal:null}); });
  document.getElementById('modal-cancel').addEventListener('click', ()=> setState({modal:null}));
  document.getElementById('modal-form').addEventListener('submit', (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = Object.fromEntries(fd.entries());
    if(m.type === 'part') savePart(data, m.editingId);
    else if(m.type === 'bom') saveBom(data, m.editingId);
    else if(m.type === 'line'){ data.parent_item_id = m.data?.parent_item_id || null; saveLine(data, m.editingId); }
    else if(m.type === 'vendor') saveVendor(data, m.editingId);
  });
}

function escapeHtml(str){
  if(str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){ return escapeHtml(str); }

render();
</script>
